<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snippet Sentinel</title>
<style>
:root{font-family:system-ui,sans-serif;color:#182b36;background:#f2f6f7}body{max-width:1120px;margin:auto;padding:32px 24px}a{color:#086e78}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #cedcdf;padding-bottom:20px}header a{text-decoration:none;font-size:24px;font-weight:800}h1{font-size:36px;letter-spacing:-1px}h2{font-size:21px}p{line-height:1.6}.muted{color:#546772}section,article{background:white;border:1px solid #d6e0e2;border-radius:12px;padding:24px;margin:22px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:16px 8px;border-bottom:1px solid #e5ecee}input,button,select{font:inherit;padding:11px;border:1px solid #a9bfc3;border-radius:6px}input{width:65%}button{background:#086e78;color:white;cursor:pointer}pre{background:#142b36;color:#e1eff2;padding:18px;border-radius:8px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.badge{display:inline-block;background:#e6f1f1;padding:5px 10px;border-radius:20px;font-size:13px;margin:3px}.error{color:#ac2b3a}.meta{display:flex;gap:12px;flex-wrap:wrap}.empty{text-align:center;padding:40px}footer{margin-top:40px;color:#546772;font-size:13px}
